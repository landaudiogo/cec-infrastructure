---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
spec:
  type: ClusterIP
  selector:
    app: notifications-service
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: dclandau/cec-notifications-service:b738c7c
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-stress
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: demo-stress
                  key: DATABASE_URL
            - name: RSA_PUBLIC_KEY
              value: /etc/secrets/ca.crt
            - name: SWAGGER_CONNECTION
              value: https://notifications.cec.dlandau.nl/api
          volumeMounts:
            - name: root-certificate
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: root-certificate
          configMap:
            name: root-certificate
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notifications-service-redirect
spec:
  parentRefs:
    - name: eg
      sectionName: http
  hostnames:
    - "notifications.cec.dlandau.nl"
  rules:
    # Let ACME HTTP-01 challenges through untouched
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/acme-challenge/
      backendRefs:
        - group: ""
          kind: Service
          name: notifications-service
          port: 3000
    # Redirect everything else to HTTPS
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notifications-service
spec:
  parentRefs:
    - name: eg
      sectionName: https.notifications.cec.dlandau.nl
  hostnames:
    - "notifications.cec.dlandau.nl"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: notifications-service
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
