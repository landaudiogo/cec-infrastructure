---
apiVersion: v1
kind: Service
metadata:
  name: experiment-producer
spec:
  type: ClusterIP
  selector:
    app: experiment-producer
  ports:
    - name: metrics
      targetPort: 3001
      port: 3001
---
apiVersion: v1
kind: Pod
metadata:
  name: experiment-producer
  labels: 
    app: experiment-producer
spec:
  restartPolicy: Never
  volumes:
    - name: config
      secret:
        secretName: experiment-producer-stress-secret
        items:
          - key: config.json
            path: config.json
    - name: creds-key
      secret:
        secretName: creds-key
        items:
          - key: creds-key
            path: creds-key
    - name: credentials
      emptyDir: {}
  initContainers:
    - name: setup-credentials
      image: alpine:3.20
      command:
        - /bin/sh
        - -ec
        - |
          apk add --no-cache wget openssl unzip

          ls -la /etc/secrets
          cat /etc/secrets/creds-key

          wget -q \
            -O /tmp/creds.zip.enc \
            https://github.com/landaudiogo/cec-infrastructure/raw/refs/heads/master/nixos/secrets/creds.zip.enc

          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/creds.zip.enc \
            -out /tmp/creds.zip \
            -pass file:/etc/secrets/creds-key

          unzip -o /tmp/creds.zip -d /tmp/credentials

          # BROKER SPECIFIC
          mv /tmp/credentials/creds/admins/landau/* /etc/credentials
          ls -la /etc/credentials
      volumeMounts:
        - name: credentials
          mountPath: /etc/credentials
        - name: creds-key
          mountPath: /etc/secrets
          readOnly: true
  containers:
    - name: experiment-producer
      image: dclandau/cec-experiment-producer:d1dee71
      args:
        - "--brokers"
        - "kafka-1:9094,kafka-2:9094,kafka-3:9094"
        - "--topic"
        - "experiment"
        - "--topic-document"
        - "experiment-document"
        - "--config-file"
        - "/etc/experiment-producer/config.json"
      env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: demo-stress
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: demo-stress
              key: DATABASE_URL
      volumeMounts:
        - name: credentials
          mountPath: /experiment-producer/auth
        - name: config
          mountPath: /etc/experiment-producer/
