apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: proxy-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https.creds.cec.dlandau.nl
      protocol: HTTPS
      hostname: creds.cec.dlandau.nl
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          name: creds.cec.dlandau.nl
    - name: kafka1-ssl
      protocol: TCP
      port: 19092
    - name: kafka2-ssl
      protocol: TCP
      port: 29092
    - name: kafka3-ssl
      protocol: TCP
      port: 39092
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy-config
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyDeployment:
        pod:
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: envoy
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: envoy
        replicas: 3
        container:
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
