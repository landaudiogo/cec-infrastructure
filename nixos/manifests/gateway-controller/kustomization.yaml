apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: envoy-gateway-system

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.1
    releaseName: eg
    namespace: envoy-gateway-system
    includeCRDs: true

resources:
  - ./resources/namespace.yaml
