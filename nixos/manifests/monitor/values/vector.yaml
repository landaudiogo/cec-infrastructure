role: Agent

customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: true
    address: 0.0.0.0:8686

  sources:
    k8s_logs:
      type: kubernetes_logs
      extra_namespace_label_selector: "kubernetes.io/metadata.name in (default)"
      extra_label_selector: "app=http-load-generator"
  
  transforms:
    extract_group:
      type: remap
      inputs:
        - k8s_logs
      source: |
        parsed, err = parse_regex(
          .message,
          r'^\[(?P<timestamp>[^\]]+)\s+(?P<level>[A-Z]+)'
        )

        if err == null {
          .timestamp = parsed.timestamp
          .level = parsed.level
        }

        parsed, err = parse_regex(
          .message,
          r'(?P<group>group[0-9]+)'
        )

        if err == null {
          .group = parsed.group
        }

        # Remove everything except the fields we want
        . = {
          "timestamp": .timestamp,
          "level": .level,
          "group": .group,
          "message": .message
        }

  sinks:
    # console:
    #   type: console
    #   inputs: [k8s_logs]
    #   encoding:
    #     codec: json
    vlogs:
      inputs:
        - extract_group
      type: elasticsearch
      endpoints:
        - http://victoria-logs-victoria-logs-single-server:9428/insert/elasticsearch/
      api_version: v8
      compression: gzip
      healthcheck:
        enabled: false
      query:
        _msg_field: message
        _time_field: timestamp
        _stream_fields: host,container_name
    # clickhouse:
    #   type: clickhouse
    #   inputs: [k8s_logs]
    #   endpoint: http://ch-cluster-clickhouse-headless:8123
    #   table: logs
    #   database: default
    #   format: json_each_row
    #   auth: 
    #     strategy: basic
    #     user: default
    #     password: secret-password
