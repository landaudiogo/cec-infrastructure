---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yaml: |
    global:
      scrape_interval: 1m
      scrape_timeout: 10s

    scrape_configs:
      - job_name: grafana
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
        - targets: ['dashboard-grafana:80']

      - job_name: notifications-service
        scrape_interval: 1s
        metrics_path: /api/metrics
        static_configs:
        - targets: ['notifications-service:3000']

      - job_name: experiment-producer
        scrape_interval: 1s
        static_configs:
        - targets: ['experiment-producer:3001']

      - job_name: http-load-generator
        scrape_interval: 1s
        static_configs:
        - targets: ['http-load-generator:3002']

      # Get metrics from other prometheus servers
      - job_name: infrastructure-costs
        scrape_interval: 15s
        metrics_path: '/federate'

        params:
          'match[]':
            - '{__name__="node_cpu_seconds_total"}'
            - '{__name__="node_memory_MemTotal_bytes"}'
            - '{__name__="node_memory_MemAvailable_bytes"}'

        static_configs:
        - targets: 
          - 'group0:3008'
          - 'group1:3008'
          - 'group2:3008'
          - 'group3:3008'
          - 'group4:3008'
          - 'group5:3008'
          - 'group6:3008'
          - 'group7:3008'
          - 'group8:3008'
          - 'group9:3008'
          - 'group10:3008'
          - 'group11:3008'
          - 'group12:3008'
          - 'group13:3008'
          - 'group14:3008'
          - 'group15:3008'
          - 'group16:3008'
          - 'group17:3008'
          - 'group18:3008'
          - 'group19:3008'
          - 'group20:3008'
          - 'landau:3008'
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: prometheus
---
apiVersion: v1
kind: Pod
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  containers:
    - name: prometheus
      image: prom/prometheus:v3.13.3
      args:
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2y
      volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yaml
          subPath: prometheus.yaml
          readOnly: true
        - name: data
          mountPath: /prometheus
  volumes:
    - name: prometheus-config
      configMap:
        name: prometheus-config
    - name: data
      persistentVolumeClaim:
        claimName: prometheus-pvc
